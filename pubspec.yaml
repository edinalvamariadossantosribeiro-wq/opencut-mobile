name: opencut_mobile
description: OpenCut - Editor de vídeo mobile estilo CapCut (Open Source)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Video e Edição
  video_player: ^2.9.1
  chewie: ^1.8.0
  video_editor: ^2.4.0
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  
  # Arquivos e Permissões
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  gallery_saver: ^3.0.2
  
  # Estado e UI
  provider: ^6.1.2
  fluttertoast: ^8.2.8
  lottie: ^3.1.2
  
  # Outros úteis
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
